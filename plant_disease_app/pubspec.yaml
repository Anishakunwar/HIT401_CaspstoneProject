name: plant_disease_app
description: Plant disease scanner — starting point (home page only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2   # lets us open the camera or gallery to get a photo
  tflite_flutter: ^0.12.1   # runs the trained .tflite model on-device
  image: ^4.2.0   # decodes and resizes photos before feeding them to the model

flutter:
  uses-material-design: true
  assets:
    - assets/lime_classifier_quantized.tflite
    - assets/fruit_classifier_quantized.tflite
    - assets/disease_classifier_quantized.tflite
